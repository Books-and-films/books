<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прочитанные книги</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: спокойная домашняя библиотека, личные заметки читателя
   IDEA: книжная полка с карточками библиотечного каталога
   PICTURE: сам список: обложки-корешки, оценки и цветные шкалы
   COLOUR and TYPE: белая бумага, переплётный синий, шкалы от красного к зелёному; Literata + Inter
   LAYOUT: скромная шапка, вкладки полок, строка фильтров, одна колонка карточек */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#12161d);--ink:light-dark(#1b1f27,#e8eaee);--mute:light-dark(#5d6573,#9aa3b2);
--line:light-dark(#e3e6eb,#262c36);--card:light-dark(#ffffff,#171c24);--cloth:light-dark(#23395b,#8fb0e0);
--chip:light-dark(#f1f3f6,#1f2530);
--s1:#d64541;--s2:#e8833a;--s3:#e2b93b;--s4:#8cc152;--s5:#2e9e5b;--empty:light-dark(#e6e8ec,#2a303b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:980px;margin:0 auto;padding:clamp(24px,4vw,48px) max(4vw,16px)}
h1{font:600 clamp(32px,5vw,46px)/1.05 Literata,Georgia,serif;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--mute);margin:0 0 24px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{flex:none;padding:10px 16px;min-height:44px;text-decoration:none;color:var(--mute);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs a[aria-current=page]{color:var(--cloth);border-color:var(--cloth)}
.tabs small{font-weight:400;margin-left:6px}
.filters{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:10px}
input,select,button{font:inherit;font-size:16px;color:var(--ink)}
input,select{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--cloth);outline-offset:2px}
.rates{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:20px}
.rates span{color:var(--mute);font-size:14px;margin-right:4px}
.rates button{min-height:36px;min-width:44px;padding:4px 12px;border-radius:18px;border:1px solid var(--line);background:var(--chip);cursor:pointer;font-weight:600}
.rates button[aria-pressed=true]{background:var(--cloth);color:var(--bg);border-color:var(--cloth)}
.count{color:var(--mute);font-size:14px;margin:0 0 12px}
.book{display:grid;grid-template-columns:92px minmax(0,1fr);gap:20px;padding:22px 0;border-top:1px solid var(--line)}
.cover{width:92px;height:138px;border-radius:3px 6px 6px 3px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.15),0 6px 14px -6px rgba(0,0,0,.35);position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;padding:12px 8px 10px 14px;color:#fff;font:600 12px/1.25 Literata,serif;display:flex;flex-direction:column;justify-content:space-between;background-image:linear-gradient(90deg,rgba(0,0,0,.25) 0 5px,rgba(255,255,255,.12) 5px 6px,transparent 6px)}
.ph i{font:400 11px/1.2 Inter,sans-serif;font-style:normal;opacity:.85}
.head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
h2{font:600 22px/1.2 Literata,Georgia,serif;margin:0}
.orig{color:var(--mute);font-size:14px;font-style:italic}
.meta{color:var(--mute);font-size:14px;margin:4px 0 10px}
.badge{flex:none;font-size:14px;font-weight:600;padding:3px 10px;border-radius:14px;color:#fff;white-space:nowrap}
.r2{background:#1f8a4c}.r1{background:#6aa84f}.r0{background:#8a929e}.rm1{background:#e07b39}.rm2{background:#c8382e}.rn{background:var(--chip);color:var(--mute)}
.scales{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 24px;margin:8px 0 12px;max-width:560px}
.sc{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.sc>span{flex:1}
.bar{display:flex;gap:3px;flex:none}
.bar b{width:16px;height:10px;border-radius:2px;background:var(--empty)}
.rev{margin:0 0 10px;max-width:68ch;white-space:pre-line}
.reads{font-size:14px;color:var(--mute);margin:0 0 8px}
.reads b{color:var(--ink);font-weight:500}
.links{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:14px}
.links a{color:var(--cloth)}
.links em{color:var(--mute);font-style:normal}
.empty{padding:40px 0;color:var(--mute);text-align:center;border-top:1px solid var(--line)}
.note{font-size:13px;color:var(--mute);margin-top:28px}

.editbar{display:none;background:var(--chip);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.editing .editbar{display:block}
.ebtn{font-size:14px;min-height:36px;padding:4px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;margin-top:10px}
.ebtn.pri{background:var(--cloth);color:var(--bg);border-color:var(--cloth)}
.mark{font-size:12px;color:var(--cloth);margin-left:8px}
.ed{display:grid;gap:14px;margin-top:10px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--chip)}
.ed h3{font:600 14px/1.3 Inter,sans-serif;margin:0 0 6px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.row input[type=number]{width:110px}.row select{width:auto;flex:1;max-width:260px}
.x{min-width:36px;min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
.pick{display:flex;gap:4px;align-items:center}
.pick button{width:36px;height:30px;border-radius:4px;border:1px solid var(--line);background:var(--empty);cursor:pointer;font-size:13px;color:var(--ink)}
.pick button.on{color:#fff;border-color:transparent}
.ed .sc{font-size:14px;color:var(--ink);flex-wrap:wrap}
.ed .sc>span{flex:0 0 170px}
.two{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
textarea{width:100%;min-height:90px;font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.ed label{font-size:13px;color:var(--mute);display:grid;gap:4px}
.ed .chk{display:flex;gap:6px;align-items:center;font-size:15px;color:var(--ink);min-height:36px}.ed .chk input{width:18px;height:18px;min-height:0}
.err{color:#c8382e;font-size:14px}
@media(max-width:600px){.two{grid-template-columns:minmax(0,1fr)}.ed .sc>span{flex-basis:100%}}
@media(max-width:600px){.filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.filters input{grid-column:1/-1}
.book{grid-template-columns:68px minmax(0,1fr);gap:14px}.cover{width:68px;height:102px}.ph{font-size:10px;padding:8px 5px 6px 10px}.ph i{display:none}
.scales{grid-template-columns:minmax(0,1fr)}h2{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Прочитанные книги</h1>
  <p class="lead">Что я читал, как оценил и стоит ли браться. Оценка: от −2 «категорически не советую» до +2 «активно рекомендую».</p>
  <nav class="tabs" id="tabs"></nav>
  <div class="filters">
    <input id="q" type="search" placeholder="Название, автор, отзыв…" aria-label="Поиск">
    <select id="yr" aria-label="Год прочтения"></select>
    <select id="sort" aria-label="Сортировка">
      <option value="read">Недавно прочитанные</option>
      <option value="rating">По оценке</option>
      <option value="title">По названию</option>
      <option value="author">По автору</option>
      <option value="year">По году издания</option>
      <option value="pages">По объёму</option>
    </select>
  </div>
  <div class="rates" id="rates"><span>Оценка:</span></div>
  <p class="count" id="count"></p>
  <div id="list"></div>
  <p class="note">Обложки подгружаются из Open Library по ISBN. Если ISBN нет, показывается корешок.</p>
</div>
<script>
{
const SHELVES={fiction:'Художественное',work:'По работе',all:'Все'};
const RATE={2:['+2','Активно рекомендую','r2'],1:['+1','Скорее рекомендую','r1'],0:['0','Проходная','r0'],'-1':['−1','Скорее не советую','rm1'],'-2':['−2','Не советую','rm2']};
const SCALES=[['ease','Легко читается'],['interest','Интересно'],['value','Дала новое'],['reread','Хочется перечитать']];
const SPINE=['#23395b','#5b2333','#2d5b4a','#5b4a23','#3d2d5b','#234f5b','#5b3a23','#41505e'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=encodeURIComponent;
const $=id=>document.getElementById(id);
const isInt=v=>Number.isInteger(v);
let base=[],books=[],edits={},shelf='fiction',rates=new Set(),db=null,editing=null,draft=null,saving=false,err='';

const rating=b=>{const r=(b.readings||[]).filter(x=>isInt(x.rating));return r.length?r[r.length-1].rating:null};
const lastRead=b=>Math.max(0,...(b.readings||[]).map(x=>x.year||0));
const hash=s=>[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
const isbn=b=>String(b.isbn||'').replace(/[^0-9Xx]/g,'');
const shelvesOf=b=>(Array.isArray(b.shelf)?b.shelf:[b.shelf]).filter(x=>x==='work'||x==='fiction');
const recompute=()=>{books=base.map(b=>edits[b.id]?{...b,...edits[b.id]}:b)};

function clean(d){
  const o={};
  {const s=shelvesOf(d);if(s.length)o.shelf=s.length===1?s[0]:s;}
  if(Array.isArray(d.readings))o.readings=d.readings.filter(x=>x&&isInt(+x.year)&&+x.year>0)
    .map(x=>isInt(x.rating)&&x.rating>=-2&&x.rating<=2?{year:+x.year,rating:x.rating}:{year:+x.year});
  if(d.scores&&typeof d.scores==='object'){o.scores={};SCALES.forEach(([k])=>{const v=d.scores[k];if(isInt(v)&&v>=1&&v<=5)o.scores[k]=v})}
  if(typeof d.review==='string')o.review=d.review;
  if('pages' in d)o.pages=isInt(d.pages)&&d.pages>0?d.pages:null;
  if(typeof d.isbn==='string')o.isbn=d.isbn;
  return o;
}
function links(b){
  const i=isbn(b),q=enc((b.title_original?[b.title_original,b.author_original]:[b.title,b.author]).filter(Boolean).join(' '));
  const L=i?[['Open Library','https://openlibrary.org/isbn/'+i],['WorldCat','https://search.worldcat.org/isbn/'+i],['Goodreads','https://www.goodreads.com/book/isbn/'+i]]
           :[['Open Library','https://openlibrary.org/search?q='+q],['WorldCat','https://search.worldcat.org/search?q='+q],['Goodreads','https://www.goodreads.com/search?q='+q]];
  return L.map(([n,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${n}</a>`).join('<em>·</em>')+(i?`<em>ISBN ${esc(i)}</em>`:'');
}
function cover(b){
  const i=isbn(b),c=SPINE[hash(b.title)%SPINE.length];
  const ph=`<div class="ph" style="background-color:${c}">${esc(b.title)}<i>${esc(b.author)}</i></div>`;
  return `<div class="cover">${ph}${i?`<img src="https://covers.openlibrary.org/b/isbn/${i}-M.jpg?default=false" alt="" loading="lazy" style="position:absolute;inset:0" onerror="this.remove()">`:''}</div>`;
}
function scale(v){
  if(!isInt(v))return '<div class="bar" title="нет оценки">'+'<b></b>'.repeat(5)+'</div>';
  return `<div class="bar" title="${v} из 5">`+[1,2,3,4,5].map(n=>`<b style="${n<=v?'background:var(--s'+v+')':''}"></b>`).join('')+'</div>';
}
function form(){
  const d=draft,rOpt=v=>`<option value="">без оценки</option>`+[2,1,0,-1,-2].map(r=>`<option value="${r}"${v===r?' selected':''}>${RATE[r][0]} · ${RATE[r][1]}</option>`).join('');
  return `<div class="ed">
    <div><h3>Прочтения и оценка (−2…+2)</h3>
      ${d.readings.map((x,i)=>`<div class="row"><input type="number" inputmode="numeric" min="1950" max="2100" placeholder="Год" value="${esc(x.year)}" data-f="year" data-i="${i}" aria-label="Год прочтения">
        <select data-f="rating" data-i="${i}" aria-label="Оценка">${rOpt(x.rating)}</select>
        <button type="button" class="x" data-act="rm" data-i="${i}" aria-label="Удалить прочтение">×</button></div>`).join('')}
      <button type="button" class="ebtn" data-act="add">+ прочтение</button></div>
    <div><h3>Шкалы (5 — хорошо)</h3>
      ${SCALES.map(([k,n])=>`<div class="sc row"><span>${n}</span><div class="pick">${[1,2,3,4,5].map(v=>`<button type="button" data-act="sc" data-k="${k}" data-v="${v}" class="${d.scores[k]>=v?'on':''}" style="${d.scores[k]>=v?'background:var(--s'+d.scores[k]+')':''}">${v}</button>`).join('')}
        <button type="button" class="x" data-act="sc" data-k="${k}" data-v="0" aria-label="Сбросить">×</button></div></div>`).join('')}</div>
    <label>Отзыв<textarea data-f="review">${esc(d.review)}</textarea></label>
    <div class="two">
      <div><label>Полка</label><div class="row"><label class="chk"><input type="checkbox" data-sh="fiction"${d.shelf.includes('fiction')?' checked':''}> Художественное</label><label class="chk"><input type="checkbox" data-sh="work"${d.shelf.includes('work')?' checked':''}> По работе</label></div></div>
      <label>Страниц (примерно)<input type="number" inputmode="numeric" min="1" data-f="pages" value="${esc(d.pages??'')}"></label>
      <label>ISBN<input type="text" data-f="isbn" value="${esc(d.isbn)}"></label>
    </div>
    ${err?`<div class="err">${esc(err)}</div>`:''}
    <div class="row"><button type="button" class="ebtn pri" data-act="save"${saving?' disabled':''}>${saving?'Сохраняю…':'Сохранить'}</button>
      <button type="button" class="ebtn" data-act="cancel">Отмена</button></div>
  </div>`;
}
function card(b){
  const r=rating(b),R=r===null?['?','Без оценки','rn']:RATE[r];
  const sc=b.scores||{},hasSc=SCALES.some(([k])=>isInt(sc[k]));
  const reads=(b.readings||[]).map(x=>`<b>${esc(x.year)}</b>${isInt(x.rating)?' ('+RATE[x.rating][0]+')':''}`).join(', ');
  const meta=[b.author,b.year&&('издана '+b.year),b.pages&&('≈'+b.pages+' стр.')].filter(Boolean).map(esc).join(' · ');
  const top=`<div class="head"><h2>${esc(b.title)}</h2><span class="badge ${R[2]}">${R[0]} · ${R[1]}</span></div>
    ${b.title_original?`<div class="orig">${esc(b.title_original)}</div>`:''}
    <div class="meta">${meta}</div>`;
  if(editing===b.id)return `<article class="book" data-id="${esc(b.id)}">${cover(b)}<div>${top}${form()}</div></article>`;
  return `<article class="book" data-id="${esc(b.id)}">${cover(b)}<div>${top}
    ${hasSc?`<div class="scales">${SCALES.map(([k,n])=>`<div class="sc"><span>${n}</span>${scale(sc[k])}</div>`).join('')}</div>`:''}
    ${b.review?`<p class="rev">${esc(b.review)}</p>`:''}
    ${reads?`<p class="reads">Читал: ${reads}</p>`:''}
    <div class="links">${links(b)}</div>
    ${db?`<button type="button" class="ebtn" data-act="edit">✎ Оценить</button>${edits[b.id]?'<span class="mark">изменено на сайте</span>':''}`:''}</div></article>`;
}
function fillYears(){
  const cur=$('yr').value;
  const years=[2026,2025]; // в фильтре только годы, по которым список полный
  $('yr').innerHTML='<option value="">Любой год прочтения</option>'+years.map(y=>`<option${String(y)===cur?' selected':''}>${esc(y)}</option>`).join('');
}
function render(){
  const q=$('q').value.trim().toLowerCase(),yr=$('yr').value,s=$('sort').value;
  let L=books.filter(b=>shelf==='all'||shelvesOf(b).includes(shelf))
    .filter(b=>!q||[b.title,b.title_original,b.author,b.author_original,b.review].join(' ').toLowerCase().includes(q))
    .filter(b=>!yr||(b.readings||[]).some(x=>String(x.year)===yr))
    .filter(b=>!rates.size||rates.has(String(rating(b)))||b.id===editing);
  const cmp={read:(a,b)=>lastRead(b)-lastRead(a),rating:(a,b)=>(rating(b)??-9)-(rating(a)??-9),
    title:(a,b)=>a.title.localeCompare(b.title,'ru'),author:(a,b)=>String(a.author).localeCompare(b.author,'ru'),
    year:(a,b)=>(a.year||9999)-(b.year||9999),pages:(a,b)=>(b.pages||0)-(a.pages||0)}[s];
  L.sort(cmp);
  $('count').textContent=L.length===books.length?`Всего книг: ${L.length}`:`Найдено: ${L.length} из ${books.length}`;
  $('list').innerHTML=L.length?L.map(card).join(''):'<div class="empty">Ничего не нашлось. Попробуйте убрать часть фильтров.</div>';
  $('tabs').innerHTML=Object.entries(SHELVES).map(([k,n])=>{
    const c=k==='all'?books.length:books.filter(b=>shelvesOf(b).includes(k)).length;
    return `<a href="#${k}"${k===shelf?' aria-current="page"':''}>${n}<small>${c}</small></a>`}).join('');
}
function route(){const h=location.hash.slice(1);shelf=SHELVES[h]?h:'fiction';render()}
async function save(){
  if(!draft.shelf.length){err='Отметьте хотя бы одну полку.';render();return}
  const id=editing,d=clean({...draft,pages:draft.pages===''||draft.pages==null?null:Math.round(+draft.pages),
    readings:draft.readings.map(x=>({year:Math.round(+x.year),rating:x.rating===''||x.rating==null?undefined:+x.rating}))});
  saving=true;err='';render();
  try{await db.collection('edits').doc(id).set({...d,updatedAt:new Date().toISOString()});
    edits[id]=d;recompute();editing=null;draft=null;fillYears();}
  catch(e){err='Не удалось сохранить: '+(e&&e.code||'ошибка')+'. Попробуйте ещё раз.'}
  saving=false;render();
}
function setup(){
  recompute();fillYears();
  $('rates').insertAdjacentHTML('beforeend',[2,1,0,-1,-2].map(r=>`<button type="button" data-r="${r}" aria-pressed="false" title="${RATE[r][1]}">${RATE[r][0]}</button>`).join(''));
  $('rates').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
    const r=t.dataset.r;rates.has(r)?rates.delete(r):rates.add(r);t.setAttribute('aria-pressed',rates.has(r));render()});
  ['q','yr','sort'].forEach(id=>$(id).addEventListener('input',render));
  $('list').addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if((!f&&!t.dataset.sh)||!draft)return;
    if(t.dataset.sh){const k=t.dataset.sh;draft.shelf=draft.shelf.filter(x=>x!==k);if(t.checked)draft.shelf.push(k);return}
    if(t.dataset.i!==undefined)draft.readings[+t.dataset.i][f]=t.value;else draft[f]=t.value});
  $('list').addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;
    const a=t.dataset.act,id=t.closest('article')?.dataset.id;
    if(a==='edit'){const b=books.find(x=>x.id===id);editing=id;err='';
      draft={shelf:shelvesOf(b),readings:(b.readings||[]).map(x=>({year:x.year,rating:isInt(x.rating)?x.rating:''})),
        scores:{...(b.scores||{})},review:b.review||'',pages:b.pages??'',isbn:b.isbn||''};
      if(!draft.readings.length)draft.readings.push({year:new Date().getFullYear(),rating:''});}
    else if(a==='cancel'){editing=null;draft=null;err=''}
    else if(a==='add')draft.readings.push({year:new Date().getFullYear(),rating:''});
    else if(a==='rm')draft.readings.splice(+t.dataset.i,1);
    else if(a==='sc'){const v=+t.dataset.v;if(v)draft.scores[t.dataset.k]=v;else delete draft.scores[t.dataset.k]}
    else if(a==='save'){if(!saving)save();return}
    else return;
    render();
    if(a==='edit')document.querySelector(`article[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({block:'nearest'});
  });
  addEventListener('hashchange',route);route();
}
fetch('books.json').then(r=>r.json()).then(d=>{base=d;setup()})
  .catch(()=>{$('list').innerHTML='<div class="empty">Не удалось загрузить books.json. Откройте сайт через GitHub Pages или локальный сервер.</div>'});
}
</script>
